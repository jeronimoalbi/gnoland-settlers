name: docs tests

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/docs-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - run: node --test
        working-directory: docs
